# Один файл на оба окружения. Окружение задаёт имя проекта (-p) и env-файл:
#   prod    — -p prod,    /opt/aeromark/.env          (порты 3000/4000)
#   staging — -p staging, /opt/aeromark/staging.env   (WEB_PORT/API_PORT, например 3100/4100)
# Том базы называется <проект>_postgres_data, поэтому staging никогда не
# касается prod_postgres_data. Запускать через prod/deploy.sh.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Тег задаёт prod/deploy.sh через release.env; значение по умолчанию —
    # образ, который работал до появления скрипта.
    image: aeromark-api:${API_TAG:-review-bebe8d3}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      APP_ORIGIN: ${APP_ORIGIN}
      DOMAIN: ${DOMAIN}
      FRONTEND_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"

  web:
    image: aeromark-web:${WEB_TAG:-review-next1634}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
