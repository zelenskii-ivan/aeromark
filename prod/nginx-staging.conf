# Staging: test.аэромарк.рф → 127.0.0.1:3100 (сайт) и :4100 (API).
# Установка — см. prod/README.md, раздел «Staging».
# Закрыт паролем и от поисковиков: это не публичный сайт.
server {
    listen 80;
    server_name test.xn--80aa4agjld3h.xn--p1ai;

    auth_basic "Aeromark staging";
    auth_basic_user_file /etc/nginx/aeromark-staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
